[project]
name = "sgf-ap"
version = "0.1.0"
description = "SGF-AP citizen registration client"
requires-python = ">=3.13,<3.15"
dependencies = [
    "flet>=0.80",
    "python-dotenv",
]

[tool.flet]
product = "SGF-AP"
org = "com.sgfap"
company = "SGF-AP"
icon_background = "#0B3D91"

[tool.flet.app]
exclude = [
    "api",
    "android",
    "db",
    "docs",
    "tests",
    "traceability_tests",
    "test_local_connector.py",
    "connector_full_test_plan.json",
    "Reporte de ejecucion de pruebas.md",
]

[tool.flet.android]
min_sdk_version = 24
target_sdk_version = 35

[tool.flet.android.manifest_application]
usesCleartextTraffic = true

[tool.flet.android.permission]
"android.permission.INTERNET" = true
